</style></head><body>
<nav id="nav"></nav><main id="v"></main>
<div id="chat"><div id="cw"><div id="cm"></div><div class="row" style="padding:8px;margin:0"><input id="ci" style="flex:1;min-width:0" placeholder="Ask about saving, investing…"><button class="b" id="cs">Send</button></div></div><button class="b" id="cb" aria-label="Open assistant">💬</button></div>
<div id="lg"></div><div id="toast"></div>
<script>
const K='finsight_v1',CATS=['Food','Rent','Transport','Shopping','Bills','Health','Entertainment','Salary','Other'];
const KW={Food:'swiggy zomato zepto blinkit grocery restaurant cafe food dominos',Rent:'rent',Transport:'uber ola metro fuel petrol irctc',Shopping:'amazon flipkart myntra mall',Bills:'electricity jio airtel recharge wifi bill',Health:'pharmacy apollo medical doctor',Entertainment:'netflix spotify movie hotstar prime',Salary:'salary stipend'};
const guess=n=>{n=n.toLowerCase();for(const c in KW)if(KW[c].split(' ').some(w=>n.includes(w)))return c;return'Other'};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={p:[{id:1,name:'My profile',tx:[],vaults:[]}],a:1};
const save=()=>{S.v=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
const P=()=>S.p.find(x=>x.id==S.a)||S.p[0];
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const mon=d=>d.slice(0,7);
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)};
const isInc=t=>t.cat=='Salary';
function stats(){const tx=P().tx,m={};tx.forEach(t=>{const k=mon(t.date);m[k]=m[k]||{i:0,e:0};isInc(t)?m[k].i+=t.amt:m[k].e+=t.amt});
const ks=Object.keys(m).sort(),inc=tx.filter(isInc).reduce((s,t)=>s+t.amt,0),exp=tx.filter(t=>!isInc(t)).reduce((s,t)=>s+t.amt,0),n=Math.max(ks.length,1);
const cat={};tx.filter(t=>!isInc(t)).forEach(t=>cat[t.cat]=(cat[t.cat]||0)+t.amt);
return{m,ks,inc,exp,bal:inc-exp,avgI:inc/n,avgE:exp/n,cat,rate:inc?(inc-exp)/inc:0}}
/* ---------- AGENTS ---------- */
function agents(){const s=stats(),tx=P().tx.filter(t=>!isInc(t)),out=[];
const A=(agent,sev,msg)=>out.push({agent,sev,msg});
if(!P().tx.length)return[{agent:'Orchestrator',sev:'med',msg:'No data yet. Add transactions or load sample data so the agents can analyse them.'}];
const needs=['Rent','Bills','Health','Food'],w=['Shopping','Entertainment'];
const nS=needs.reduce((a,c)=>a+(s.cat[c]||0),0),wS=w.reduce((a,c)=>a+(s.cat[c]||0),0);
if(s.inc){const nP=nS/s.inc*100,wP=wS/s.inc*100;
A('Budget agent',nP>50?'med':'ok',`Needs take ${nP.toFixed(0)}% of income (target 50%), wants ${wP.toFixed(0)}% (target 30%), savings ${(s.rate*100).toFixed(0)}% (target 20%).`);
if(wP>30)A('Budget agent','high',`Wants exceed 30% of income. Trimming Shopping and Entertainment by ${inr((wS-.3*s.inc)/Math.max(s.ks.length,1))} a month restores balance.`)}
const top=Object.entries(s.cat).sort((a,b)=>b[1]-a[1])[0];if(top)A('Budget agent','ok',`Biggest spend: ${top[0]} at ${inr(top[1])} (${(top[1]/s.exp*100).toFixed(0)}% of all spending).`);
const by={};tx.forEach(t=>(by[t.cat]=by[t.cat]||[]).push(t.amt));let fl=0;
tx.forEach(t=>{const a=by[t.cat].slice().sort((x,y)=>x-y),med=a[Math.floor(a.length/2)];if(a.length>=4&&t.amt>3*med&&t.amt>1000){fl++;A('Fraud & anomaly agent','high',`${t.name} on ${t.date} (${inr(t.amt)}) is over 3x your usual ${t.cat} payment of ${inr(med)}. Verify it.`)}});
if(!fl)A('Fraud & anomaly agent','ok','No unusual transactions found.');
const sub={};tx.forEach(t=>{const k=t.name.toLowerCase()+'|'+t.amt;(sub[k]=sub[k]||new Set()).add(mon(t.date))});
const rec=Object.entries(sub).filter(([k,v])=>v.size>=2&&!k.startsWith('rent'));
A('Subscription agent',rec.length?'med':'ok',rec.length?`Recurring payments: ${rec.map(([k])=>k.split('|')[0]+' '+inr(+k.split('|')[1])).join(', ')}. Cancel any you do not use.`:'No recurring payments detected.');
Object.entries(P().lim||{}).forEach(([c,l])=>{const u=(s.cat[c]||0)/Math.max(s.ks.length,1);if(l&&u>l)A('Budget agent','high',`${c} averages ${inr(u)} a month, over your ${inr(l)} limit.`)});const run=s.avgE?s.bal/s.avgE:0;
A('Savings agent',run<3?'high':run<6?'med':'ok',`Runway is ${run.toFixed(1)} months of spending. Aim for 6. ${run<6?'Save '+inr(Math.max(s.avgE*6-s.bal,0)/6)+' a month for 6 months to get there.':'You are covered.'}`);
const risk=s.rate>.25&&run>=6?'Aggressive':s.rate>.1&&run>=3?'Moderate':'Conservative';
const al={Aggressive:'70% equity index funds, 15% gold, 15% debt',Moderate:'50% equity index funds, 15% gold, 35% debt',Conservative:'20% equity index funds, 10% gold, 70% debt and liquid funds'}[risk];
A('Investment agent','ok',`Your profile fits a ${risk} allocation: ${al}. Start a SIP of ${inr(Math.max(s.avgI*.1,500))} a month. Educational guidance, not advice.`);
const hi=out.filter(o=>o.sev=='high').length;out.unshift({agent:'Orchestrator',sev:hi?'high':'ok',msg:`${out.length} findings from 5 agents, ${hi} need attention.`});return out}
/* ---------- VIEWS ---------- */
const V={};let cur='home';
V.home=()=>{const s=stats(),ks=s.ks.slice(-6),mx=Math.max(1,...ks.map(k=>Math.max(s.m[k].i,s.m[k].e)));
const bars=ks.map((k,i)=>{const x=20+i*70,hi=s.m[k].i/mx*140,he=s.m[k].e/mx*140;return`<rect x="${x}" y="${160-hi}" width="24" height="${hi}" fill="var(--ok)"/><rect x="${x+27}" y="${160-he}" width="24" height="${he}" fill="var(--acc)"/><text x="${x}" y="176" font-size="11" fill="var(--mute)">${k.slice(2)}</text>`}).join('');
const cats=Object.entries(s.cat).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${c}</span><span>${inr(v)}</span></div><div class="bar"><i style="width:${v/s.exp*100}%;background:var(--acc)"></i></div></div>`).join('');
return`<h2>Hello, ${P().name}</h2><div class="hero"><small style="color:#ffffffbb">Net worth</small><div class="big">${inr(nwv())}</div><div style="margin:12px 0 6px">Tell FinSight what you spent</div><div class="row" style="margin:0"><input id="nlq" placeholder="spent 450 on Swiggy yesterday" style="flex:1;min-width:200px" onkeydown="if(event.key=='Enter')nl()"><button class="b" onclick="nl()">Add with AI</button></div></div><div class="g"><div class="c"><small>Balance</small><div class="big ${s.bal<0?'bad':''}">${inr(s.bal)}</div></div><div class="c"><small>Income</small><div class="big ok">${inr(s.inc)}</div></div><div class="c"><small>Spent</small><div class="big">${inr(s.exp)}</div></div><div class="c"><small>Savings rate</small><div class="big">${(s.rate*100).toFixed(0)}%</div></div><div class="c"><small>Health score</small><div class="big">${hs(s)}/100</div></div><div class="c"><small>Forecast spend, next month</small><div class="big">${inr(fc(s.ks.map(k=>s.m[k].e)))}</div></div></div>
${P().tx.length?'':`<div class="c" style="margin-bottom:14px">No transactions yet. <button class="b" onclick="sample()">Load 5 months of sample data</button> or add your own under Transactions.</div>`}
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="c"><b>Income vs spending</b><svg viewBox="0 0 440 185" style="width:100%">${bars}</svg><small><span class="ok">■</span> income &nbsp;<span style="color:var(--acc)">■</span> spending</small></div><div class="c"><b>Where money goes</b>${cats||'<p><small>Nothing yet.</small></p>'}</div></div>${briefing()}${visuals()}${deck()}`};
V.tx=()=>`<h2>Transactions</h2><div class="c row"><input id="tn" placeholder="Merchant (e.g. Swiggy)"><input id="ta" type="number" placeholder="Amount"><select id="tc"><option value="">Auto category</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="td" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="b" onclick="addTx()">Add</button></div>
<div class="c sc"><table><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Amount</th><th></th></tr>${P().tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${t.date}</td><td>${t.name}</td><td><span class="tag">${t.cat}</span></td><td class="${isInc(t)?'ok':''}">${isInc(t)?'+':'−'}${inr(t.amt)}</td><td><button class="b s" onclick="delTx(${t.id})">✕</button></td></tr>`).join('')}</table></div>
<div class="row" style="margin-top:12px"><button class="b s" onclick="csv()">Export CSV</button> <label class="b s" style="cursor:pointer">Scan receipt<input type="file" accept="image/*" hidden onchange="scan(this)"></label><label class="b s" style="cursor:pointer">Import CSV<input type="file" accept=".csv" hidden onchange="imp(this)"></label></div><small>CSV columns: date,merchant,amount,category(optional). Duplicates are skipped.</small><div class="c" style="margin-top:12px"><b>Smart statement import</b><p><small>Paste bank statement rows, one per line: date, narration, amount. Messy narrations like UPI/3281902839/SWIGGY BLR/HDFCBK are cleaned and categorised.</small></p><textarea id="si" rows="5" style="width:100%" placeholder="18/10/2026, UPI/3281902839/SWIGGY BLR/HDFCBK/Payment, 420"></textarea><div class="row" style="margin-top:8px"><button class="b" onclick="smart()">Clean and import</button></div></div>`;

async function gpay(){if(g4.value!=G.otp)return toast('Wrong OTP');const gb=document.getElementById('gb');gb.innerHTML='<p>Processing…</p>';await new Promise(r=>setTimeout(r,1200));const pid='pay_'+Math.random().toString(36).slice(2,12),h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(G.oid+'|'+pid+'|finsight_test_secret')),sig=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''),r={oid:G.oid,pid,sig,n:G.n,a:G.a,m:G.m,t:new Date().toISOString()};(P().pays=P().pays||[]).push(r);P().tx.push({id:Date.now(),name:G.n,amt:G.a,cat:guess(G.n),date:r.t.slice(0,10)});log('Payment '+pid+' of '+inr(G.a));save();gb.innerHTML=`<p class="ok"><b>Payment successful</b></p><small>${pid}<br>${G.m}<br>Signature ${sig.slice(0,24)}…</small><div class="row" style="margin-top:8px"><button class="b" onclick="rcpt('${pid}')">Download receipt</button><button class="b s" onclick="gw.remove();render()">Done</button></div>`;try{speechSynthesis.speak(new SpeechSynthesisUtterance('Payment of '+Math.round(G.a)+' rupees successful'))}catch(e){}}

V.lifelab=()=>{const s=stats();const essentialCats=['Rent','Bills','Food','Health','Transport'];const essentials=essentialCats.reduce((a,c)=>a+(s.cat[c]||0),0)/Math.max(s.ks.length,1);const income=Math.max(0,s.avgI);const spend=Math.max(0,s.avgE);return `<h2>Life Lab</h2><p class="lead">Stress-test everyday money decisions before they become emergencies. Calculations use your recorded history plus assumptions you can change.</p>
<div class="hero"><small style="color:#ffffffbb">FINANCIAL RESILIENCE WORKSPACE</small><div class="big">Plan for the unexpected.</div><p style="max-width:620px">What if your salary drops, an urgent bill arrives, or monthly costs rise? See the potential impact and a practical next step.</p><div class="row"><button class="b" onclick="lifePreset('paycut')">↘ 30% pay cut</button><button class="b s" onclick="lifePreset('jobloss')">◷ Job loss</button><button class="b s" onclick="lifePreset('medical')">＋ Emergency expense</button></div></div>

function lifePreset(kind){const cash=document.getElementById('llcash'),cut=document.getElementById('llcut'),shock=document.getElementById('llshock');if(!cash||!cut||!shock)return;if(kind==='paycut'){cut.value=30;shock.value=0}else if(kind==='jobloss'){cut.value=100;shock.value=0}else{cut.value=0;shock.value=50000}lifeCalc()}
function lifeCalc(){const get=id=>Math.max(0,Number(document.getElementById(id)?.value)||0);const cash=get('llcash'),inc=get('llincome'),ess=get('llessential'),cut=Math.min(100,get('llcut')),shock=get('llshock'),saving=get('llsave'),purchase=get('llpurchase'),months=Math.max(1,Math.min(120,get('llmonths')));const net=inc*(1-cut/100)-ess;const remaining=Math.max(0,cash-shock);const runway=ess?remaining/ess:0;const target3=ess*3,target6=ess*6,gap=Math.max(0,target6-remaining);const r=document.getElementById('llresult');if(r)r.innerHTML=`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px"><div class="c"><small>Monthly after essentials</small><div class="big ${net<0?'bad':'ok'}" style="font-size:21px">${inr(net)}</div></div><div class="c"><small>Runway after shock</small><div class="big" style="font-size:21px">${runway.toFixed(1)} mo</div></div></div><div class="bar" style="margin:12px 0"><i style="width:${Math.min(100,runway/6*100)}%;background:${runway<3?'var(--bad)':runway<6?'var(--acc)':'var(--ok)'}"></i></div><p><b>${net<0?'Monthly shortfall likely':runway<3?'Limited emergency buffer':runway<6?'Some protection, but a gap remains':'A six-month buffer is covered under these assumptions'}</b></p><p><small>${net<0?'The shock leaves a gap of '+inr(Math.abs(net))+' each month before discretionary spending. Prioritise essentials and contact lenders/providers early if a payment may be missed.':'After the assumed income change and essential costs, '+inr(net)+' remains per month before discretionary spending and other obligations.'}</small></p>${shock?`<p><small>The one-off expense reduces the assumed cash buffer by ${inr(shock)}.</small></p>`:''}`;
const f=document.getElementById('llfund');if(f)f.innerHTML=`<div class="row" style="justify-content:space-between;margin:8px 0"><span>3-month target</span><b>${inr(target3)}</b></div><div class="bar"><i style="width:${target3?Math.min(100,remaining/target3*100):100}%"></i></div><div class="row" style="justify-content:space-between;margin:12px 0 8px"><span>6-month target</span><b>${inr(target6)}</b></div><div class="bar"><i style="width:${target6?Math.min(100,remaining/target6*100):100}%;background:var(--acc)"></i></div><p><small>Gap to 6-month target: <b>${inr(gap)}</b>. At ${inr(saving)}/month, estimated time to target: ${saving?Math.ceil(gap/saving)+' months':'set a monthly savings amount'}.</small></p>`;
const b=document.getElementById('llbuy');if(b){const monthly=saving||Math.max(0,inc-ess);const per= purchase/months;const total=monthly*months;b.innerHTML=`<div class="c" style="margin-top:8px"><small>Required monthly saving</small><div class="big" style="font-size:22px">${inr(per)}</div><small>At your assumed saving capacity of ${inr(monthly)}/month, ${total>=purchase?'the target appears reachable in this simple estimate.':'you may be short by '+inr(purchase-total)+' over '+months+' months.'}</small><div class="bar" style="margin-top:10px"><i style="width:${purchase?Math.min(100,total/purchase*100):100}%;background:${total>=purchase?'var(--ok)':'var(--acc)'}"></i></div></div>`}}

d database, verified email recovery, authoritative payment processing or cross-device sync is guaranteed by this standalone build.</small></p><span class="tag">Needs backend work</span></div></div><div class="c"><b>Production hardening roadmap</b><div style="margin-top:10px">${[['Identity & access','Server-side sessions, verified email, password reset, rate limits and CSRF protection'],['Data layer','FastAPI service, PostgreSQL migrations, per-user authorization and backups'],['Financial integrations','Sandbox-first payment provider integration; explicit consent and compliant bank-data provider'],['Quality & operations','Automated tests, CI checks, structured logs, monitoring, dependency scanning and security review'],['Decision support','Scenario simulator for income shocks, emergency-fund runway and planned purchases; outputs are estimates based on user inputs']].map(([a,b],i)=>`<div class="row" style="align-items:flex-start;margin:12px 0"><span class="tag">${String(i+1).padStart(2,'0')}</span><div><b>${a}</b><div><small>${b}</small></div></div></div>`).join('')}</div></div><p><small>For academic evaluation, describe this accurately as a local-first finance intelligence prototype with modular analytics. Do not present browser-only login or simulated checkout as production-grade authentication or payments.</small></p>`;

V.obligations=()=>{ensureAdv();const p=P(),items=p.obligations.slice().sort((a,b)=>a.due.localeCompare(b.due)),s=stats();const cash=Math.max(0,Number(p.cashOnHand??s.bal)||0),next30=items.filter(x=>x.status!=='paid'&&x.due>=todayISO()&&x.due<=new Date(Date.now()+30*86400000).toISOString().slice(0,10)).reduce((a,x)=>a+x.amount,0),forecast=cash+s.avgI*1-(s.avgE||0)-next30,late=items.filter(x=>x.status!=='paid'&&x.due<todayISO()).length;return `<h2>Bill & EMI Early Warning</h2><p class="lead">Track due dates and compare known obligations against a simple 30-day cash estimate. Alerts are only as complete as the data you enter.</p>

<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))"><div class="c"><h3>Add obligation</h3><label><small>Name</small><input id="obname" placeholder="Rent / SBI EMI / electricity" style="width:100%"></label><div class="row" style="margin-top:10px"><label style="flex:1"><small>Amount ₹</small><input id="obamt" type="number" min="1" placeholder="8500" style="width:100%"></label><label style="flex:1"><small>Due date</small><input id="obdue" type="date" value="${todayISO()}" style="width:100%"></label></div><div class="row"><label style="flex:1"><small>Type</small><select id="obtype" style="width:100%"><option>Utility</option><option>Rent</option><option>EMI</option><option>Credit card</option><option>Subscription</option><option>Insurance</option><option>Other</option></select></label><label style="flex:1"><small>Repeat</small><select id="obrepeat" style="width:100%"><option value="monthly">Monthly</option><option value="once">One-time</option></select></label></div><button class="b" onclick="addObligation()">＋ Save obligation</button></div><div class="c"><h3>Cash forecast assumptions</h3><label><small>Current liquid cash ₹</small><input id="obcash" type="number" min="0" value="${Math.round(cash)}" style="width:100%;margin:6px 0 12px" onchange="setCash(this.value)"></label><p><small>Uses recent average income and expenses from your ledger. It does not account for transactions you haven't entered, bank settlement timing or uncertain income.</small></p><button class="b s" onclick="seedObligations()">Load sample obligations</button><button class="b s" onclick="loadServerObligations()">↻ Load server records</button></div></div>
<div class="c"><h3>Obligation calendar</h3>${items.length?`<div class="sc"><table><thead><tr><th>Due</th><th>Obligation</th><th>Type</th><th>Amount</th><th>Status / action</th></tr></thead><tbody>${items.map(o=>`<tr><td>${moneyDate(o.due)}</td><td><b>${esc(o.name)}</b><br><small>${o.repeat==='monthly'?'Repeats monthly':'One-time'}</small></td><td>${esc(o.type)}</td><td>${inr(o.amount)}</td><td>${o.status==='paid'?'<span class="tag">Paid</span>':o.due<todayISO()?'<span class="tag" style="color:var(--bad)">Overdue</span>':'<span class="tag">Upcoming</span>'}<div class="row" style="margin:5px 0 0">${o.status!=='paid'?`<button class="b s" onclick="markObPaid(${o.id})">Mark paid</button>`:''}<button class="b s" onclick="deleteObligation(${o.id})">Remove</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p><small>No obligations recorded yet. Add real due dates or load sample data to explore the alerts.</small></p>'}</div>
<div class="c" style="margin-top:14px"><h3>Why this warning appeared</h3><p><small>Rule: if estimated cash after known obligations is below zero, show a cash-shortfall warning; overdue unpaid items are flagged separately. Forecast confidence is limited because income/spending averages can hide timing effects.</small></p><b class="${forecast<0||late?'bad':'ok'}">${forecast<0?'Potential shortfall: plan which non-essential spending can wait and contact the biller/lender before the due date.':late?'There are overdue obligations. Verify whether they were paid and update the status.':'No shortfall detected from the currently recorded assumptions.'}</b></div>`};
async function addObligation(){ensureAdv();const name=document.getElementById('obname').value.trim(),amount=Number(document.getElementById('obamt').value),due=document.getElementById('obdue').value,type=document.getElementById('obtype').value,repeat=document.getElementById('obrepeat').value;if(!name||amount<=0||!due)return toast('Enter a name, positive amount and due date');P().obligations.push({id:Date.now(),name,amount,due,type,repeat,status:'unpaid'});save();const token=localStorage.getItem('finsight_api_token');if(token){try{await apiRequest('/api/v1/obligations',{method:'POST',body:JSON.stringify({name,amount,due_date:due,kind:type})});toast('Obligation saved locally and on server')}catch(e){render();toast('Saved locally; server sync failed: '+e.message);return}}render();toast('Obligation saved locally')}
function setCash(v){P().cashOnHand=Math.max(0,Number(v)||0);save();render()}
function markObPaid(id){ensureAdv();const o=P().obligations.find(x=>x.id===id);if(o)o.status='paid';save();render()}
function deleteObligation(id){P().obligations=P().obligations.filter(x=>x.id!==id);save();render()}
function seedObligations(){ensureAdv();const d=new Date();const iso=n=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};[['Rent',12000,3,'Rent'],['Electricity',1850,8,'Utility'],['Education loan EMI',4200,12,'EMI'],['Credit card bill',6300,18,'Credit card'],['Internet',999,24,'Utility']].forEach(([name,amount,n,type],i)=>P().obligations.push({id:Date.now()+i,name,amount,due:iso(n),type,repeat:'monthly',status:'unpaid'}));P().cashOnHand=P().cashOnHand??25000;save();render();toast('Sample obligations added — replace with your own data')}
V.debt=()=>{ensureAdv();const p=P(),debts=p.debtLab,principal=debts.reduce((a,d)=>a+d.balance,0),minTotal=debts.reduce((a,d)=>a+d.min,0);return `<h2>Debt Freedom Simulator</h2><p class="lead">Compare avalanche and snowball repayment approaches using balances, rates and minimum payments you enter.</p><div class="hero"><small>DEBT STRATEGY LAB</small><div class="big">Make the repayment trade-off visible.</div><p>Avalanche prioritises the highest interest rate; snowball prioritises the smallest balance. Estimates assume monthly interest and consistent payments.</p></div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="c"><h3>Add a debt</h3><label><small>Loan / card name</small><input id="dn" placeholder="Credit card / personal loan" style="width:100%"></label><div class="row" style="margin-top:8px"><label style="flex:1"><small>Balance ₹</small><input id="db" type="number" min="1" placeholder="45000" style="width:100%"></label><label style="flex:1"><small>Annual interest %</small><input id="dr" type="number" min="0" max="100" step="0.1" placeholder="18" style="width:100%"></label></div><label><small>Monthly minimum payment ₹</small><input id="dm" type="number" min="1" placeholder="2500" style="width:100%;margin:5px 0 12px"></label><button class="b" onclick="addDebt()">＋ Add debt</button><button class="b s" onclick="seedDebts()">Load sample debts</button><button class="b s" onclick="loadServerDebts()">↻ Load server records</button></div><div class="c"><h3>Monthly repayment budget</h3><p><small>Total extra amount available above minimum payments.</small></p><input id="dex" type="number" min="0" value="3000" style="width:100%" oninput="debtCalc()"><div id="debtSummary" style="margin-top:12px"></div></div></div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="c"><h3>Debt avalanche</h3><p><small>Highest interest first — generally minimises interest under these assumptions.</small></p><div id="avalanche"></div></div><div class="c"><h3>Debt snowball</h3><p><small>Smallest balance first — may give earlier wins, but can cost more interest.</small></p><div id="snowball"></div></div></div><div class="c"><h3>Your debt list</h3>${debts.length?`<div class="sc"><table><thead><tr><th>Debt</th><th>Balance</th><th>APR</th><th>Minimum</th><th></th></tr></thead><tbody>${debts.map(d=>`<tr><td>${esc(d.name)}</td><td>${inr(d.balance)}</td><td>${d.rate}%</td><td>${inr(d.min)}</td><td><button class="b s" onclick="removeDebt(${d.id})">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<p><small>Add debt information or load sample debts. Do not enter account numbers or other sensitive identifiers.</small></p>'}</div><div class="c"><small>Model limits: ignores fees, changing APRs, promotional periods, payment timing and lender-specific rules. A result is an estimate, not a payoff quote. Continue paying at least each lender's required minimum.</small></div>`};
async function addDebt(){ensureAdv();const name=document.getElementById('dn').value.trim(),balance=Number(document.getElementById('db').value),rate=Number(document.getElementById('dr').value),min=Number(document.getElementById('dm').value);if(!name||balance<=0||rate<0||min<=0)return toast('Enter valid debt details');P().debtLab.push({id:Date.now(),name,balance,rate,min});save();const token=localStorage.getItem('finsight_api_token');if(token){try{await apiRequest('/api/v1/debts',{method:'POST',body:JSON.stringify({name,balance,annual_rate:rate,minimum_payment:min})});toast('Debt saved locally and on server')}catch(e){render();debtCalc();toast('Saved locally; server sync failed: '+e.message);return}}render();debtCalc();toast('Debt added locally')}
function removeDebt(id){P().debtLab=P().debtLab.filter(d=>d.id!==id);save();render()}
function seedDebts(){ensureAdv();P().debtLab.push({id:Date.now()+1,name:'Credit card',balance:38000,rate:36,min:2500},{id:Date.now()+2,name:'Education loan',balance:145000,rate:9.5,min:4200},{id:Date.now()+3,name:'Consumer loan',balance:52000,rate:16,min:3200});save();render();debtCalc();toast('Sample debts added — edit assumptions as needed')}
function simulateDebt(order,extra){let ds=P().debtLab.map(d=>({...d,b:d.balance,interest:0}));if(!ds.length)return {months:0,interest:0,paid:0,done:true};const minSum=ds.reduce((a,d)=>a+d.min,0);if(extra+minSum<=0)return {months:0,interest:0,paid:0,done:false};let totalInt=0,months=0,paid=0;while(ds.some(d=>d.b>0.01)&&months<600){months++;ds.forEach(d=>{if(d.b>0){const i=d.b*(d.rate/100)/12;d.b+=i;d.interest+=i;totalInt+=i}});let budget=extra+minSum;for(const d of ds){if(d.b<=0)continue;const pay=Math.min(d.b,d.min);d.b-=pay;budget-=pay;paid+=pay}const sorted=ds.filter(d=>d.b>0).sort((a,b)=>order==='avalanche'?b.rate-a.rate:a.b-b.b);for(const d of sorted){if(budget<=0)break;const pay=Math.min(d.b,budget);d.b-=pay;budget-=pay;paid+=pay}if(ds.some(d=>d.b>0.01)&&ds.every(d=>d.rate>0)&&extra===0&&minSum<ds.reduce((a,d)=>a+d.b*(d.rate/100)/12,0))return {months:months,interest:totalInt,paid,done:false};}return {months,interest:totalInt,paid,done:!ds.some(d=>d.b>0.01)}}
function debtCalc(){const a=document.getElementById('avalanche'),s=document.getElementById('snowball');if(!a||!s)return;const extra=Math.max(0,Number(document.getElementById('dex').value)||0),av=simulateDebt('avalanche',extra),sn=simulateDebt('snowball',extra),fmt=r=>r.months>=600?'More than 50 years':r.done?`${Math.floor(r.months/12)}y ${r.months%12}m`:'Payment may not cover accruing interest';a.innerHTML=`<div class="big">${av.done?av.months+' months':'Review budget'}</div><p>Estimated interest: <b>${inr(av.interest)}</b></p><p><small>Total simulated paid: ${inr(av.paid)}</small></p>`;s.innerHTML=`<div class="big">${sn.done?sn.months+' months':'Review budget'}</div><p>Estimated interest: <b>${inr(sn.interest)}</b></p><p><small>Total simulated paid: ${inr(sn.paid)}</small></p>`;const sum=document.getElementById('debtSummary');if(sum){const diff=sn.interest-av.interest;sum.innerHTML=`<p>Minimums: <b>${inr(P().debtLab.reduce((x,d)=>x+d.min,0))}/month</b></p><p>Extra: <b>${inr(extra)}/month</b></p><p>${av.done&&sn.done?`Avalanche saves an estimated <b>${inr(Math.max(0,diff))}</b> interest vs. snowball in this simulation.`:'Check whether the payment budget is enough to cover monthly interest.'}</p>`}}
V.explain=()=>{const s=stats(),tx=P().tx,findings=agents().slice(0,15),cat=Object.entries(s.cat).sort((a,b)=>b[1]-a[1])[0];return `<h2>Explainable Financial Intelligence</h2><p class="lead">Every finding should tell you what was observed, which rule fired, what assumptions were used, and what to verify next.</p><div class="hero"><small>TRANSPARENT DECISION SUPPORT</small><div class="big">Show your working, not just the answer.</div><p>Review rule-based findings generated from this profile's ledger. Findings are heuristics and may be wrong if data is incomplete or categorised incorrectly.</p><div class="row"><button class="b" onclick="recordExplainRun()">Save analysis snapshot</button><button class="b s" onclick="exportExplain()">Export findings JSON</button></div></div><div class="g"><div class="c"><small>Transactions examined</small><div class="big">${tx.length}</div><small>Current profile only</small></div><div class="c"><small>Average monthly spending</small><div class="big">${inr(s.avgE||0)}</div><small>Derived from recorded history</small></div><div class="c"><small>Current findings</small><div class="big">${findings.length}</div><small>Rule-based output</small></div><div class="c"><small>Largest category</small><div class="big" style="font-size:20px">${cat?esc(cat[0]):'—'}</div><small>${cat?inr(cat[1]):'Add transactions first'}</small></div></div><div class="c"><h3>Findings & evidence</h3>${findings.map((f,i)=>{const evidence=explainEvidence(f,tx,s);return `<details ${i===0?'open':''} style="padding:12px 0;border-bottom:1px solid var(--line)"><summary style="cursor:pointer"><span class="tag">${esc(f.sev||'info')}</span> <b>${esc(f.agent)}</b> — ${esc(f.msg)}</summary><div style="padding:12px 0 0 12px"><p><b>Observed data</b><br><small>${esc(evidence.observed)}</small></p><p><b>Rule / calculation</b><br><small>${esc(evidence.rule)}</small></p><p><b>Assumptions and limits</b><br><small>${esc(evidence.limit)}</small></p><p><b>Suggested verification</b><br><small>${esc(evidence.action)}</small></p></div></details>`}).join('')||'<p><small>No findings available yet. Add transactions or load sample data.</small></p>'}</div><div class="c"><h3>Analysis history</h3>${(P().insightLog||[]).slice().reverse().slice(0,8).map(x=>`<p><b>${moneyDate(x.date)}</b> · ${x.count} findings · <small>${esc(x.summary)}</small></p>`).join('')||'<p><small>No saved snapshots. Save an analysis to keep a local audit trail.</small></p>'}</div><p><small>Explainability is implemented for the built-in rule layer. LLM-generated advice must be separately labelled, schema-validated, and logged with model/version and prompt metadata on the server; it must not be represented as deterministic evidence.</small></p>`};
function explainEvidence(f,tx,s){let observed='Profile has '+tx.length+' recorded transactions; average income '+inr(s.avgI||0)+' and average spending '+inr(s.avgE||0)+'.';let rule='The finding was produced by the current built-in agent heuristic; see the finding text for the triggering condition.';let limit='Only entered transactions are considered. Missing, duplicated or miscategorised records can change this result.';let action='Review the source transactions and correct categories or dates before acting.';if(String(f.agent).toLowerCase().includes('fraud')||String(f.agent).toLowerCase().includes('anomaly')){rule='Compare a transaction with the median of recorded transactions in the same category; flag if it is above 3× the median and above ₹1,000.';action='Confirm merchant, amount and receipt directly. A high amount alone does not prove fraud.'}else if(String(f.agent).toLowerCase().includes('budget')){rule='Compare observed category spending / monthly average with recorded category limit or the 50/30/20 heuristic.';action='Check the period and category; adjust the budget only if it reflects your real plan.'}else if(String(f.agent).toLowerCase().includes('subscription')){rule='Look for repeated merchant names or similar payments across dates.';action='Check the merchant account and cancellation terms; do not assume every recurring payment is unwanted.'}return {observed,rule,limit,action}}
function recordExplainRun(){ensureAdv();const fs=agents();P().insightLog.push({date:todayISO(),count:fs.length,summary:fs[0]?.msg||'Analysis completed',findings:fs});save();render();toast('Analysis snapshot saved locally')}
function exportExplain(){const blob=new Blob([JSON.stringify({generatedAt:new Date().toISOString(),profile:P().name,findings:agents().map(f=>({...f,evidence:explainEvidence(f,P().tx,stats())}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finsight-explainability.json';a.click();URL.revokeObjectURL(a.href)}
V.backend=()=>`<h2>Secure backend & AI operations</h2><p class="lead">Connect this browser client to the included FastAPI service. Server authentication, PostgreSQL persistence, audit events and AI provider calls live on the backend—not in browser code.</p><div class="hero"><small>PLATFORM CONTROL PLANE</small><div class="big">From local prototype to service-backed app.</div><p>Start the API locally, configure the base URL, then test health and sign in. API keys stay on the server in environment variables.</p></div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="c"><h3>API connection</h3><label><small>Base URL</small><input id="apiurl" value="${esc(localStorage.getItem('finsight_api_url')||'http://127.0.0.1:8000')}" style="width:100%;margin:6px 0 10px"></label><div class="row"><button class="b" onclick="testBackend()">Test health</button><button class="b s" onclick="saveApiUrl()">Save URL</button></div><div id="apihealth"><small>Not checked yet.</small></div><p><small>When opened from file://, the browser may block requests depending on CORS and browser settings. Use the local web server instructions in README for reliable testing.</small></p></div><div class="c"><h3>Server sign-in</h3><label><small>Email</small><input id="apiemail" type="email" placeholder="you@example.com" style="width:100%;margin:6px 0"></label><label><small>Password</small><input id="apipass" type="password" placeholder="At least 12 characters" style="width:100%;margin:6px 0 10px"></label><div class="row"><button class="b" onclick="apiRegister()">Create account</button><button class="b s" onclick="apiLogin()">Sign in</button></div><div id="apiauth"><small>No server session active in this browser.</small></div></div></div><div class="g"><div class="c"><h3>Security controls</h3><p>Argon2 password hashing, expiring signed access tokens, ownership-scoped records, request validation, security headers, structured event logging and environment-only secrets.</p></div><div class="c"><h3>AI orchestrator</h3><p>Specialist agent tasks return structured JSON, validate required fields, log request metadata, and fall back to transparent deterministic rules when no provider key is configured.</p></div><div class="c"><h3>Data store</h3><p>PostgreSQL is the recommended deployment database. SQLite is supported for local tests. Alembic migrations, backups, rate limiting, email verification and independent security review remain production tasks.</p></div></div><div class="c"><h3>Run the agent orchestrator</h3><p><small>This sends your question and only the JSON context you enter to your configured backend. Do not include account numbers or sensitive identifiers.</small></p><label><small>Question</small><input id="agentq" value="Can I cover my upcoming bills?" style="width:100%;margin:5px 0 10px"></label><label><small>Context JSON</small><textarea id="agentctx" rows="3" style="width:100%">{"cash":25000,"upcoming_obligations":18000}</textarea></label><button class="b" onclick="runServerAgents()">Run server agents</button><div id="agentresult" style="margin-top:12px"></div></div><div class="c"><h3>API token status</h3><p><small id="tokenstate">${localStorage.getItem('finsight_api_token')?'A bearer token is stored in this browser.':'No server token stored.'}</small></p><button class="b s" onclick="apiLogout()">Clear local API session</button></div>`;
function apiBase(){return (document.getElementById('apiurl')?.value||localStorage.getItem('finsight_api_url')||'http://127.0.0.1:8000').replace(/\/$/,'')}
function saveApiUrl(){localStorage.setItem('finsight_api_url',apiBase());toast('API URL saved locally')}
async function testBackend(){const el=document.getElementById('apihealth');if(!el)return;el.innerHTML='<small>Checking…</small>';try{const r=await fetch(apiBase()+'/healthz');const j=await r.json();el.innerHTML=`<span class="ok"><b>● API reachable</b></span><p><small>${esc(j.status||'ok')} · ${esc(j.version||'version unavailable')}</small></p>`}catch(e){el.innerHTML='<span class="bad"><b>● API not reachable</b></span><p><small>Start backend using the README commands. '+esc(e.message)+'</small></p>'}}
async function apiRegister(){const email=document.getElementById('apiemail').value.trim(),password=document.getElementById('apipass').value;if(!email||password.length<12)return toast('Enter email and a password of at least 12 characters');try{const r=await fetch(apiBase()+'/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw Error(j.detail||'Registration failed');localStorage.setItem('finsight_api_token',j.access_token);document.getElementById('apiauth').innerHTML='<span class="ok">Server account created and signed in.</span>';document.getElementById('tokenstate').textContent='Bearer token stored locally; clear it when finished.';toast('Server account created')}catch(e){toast(e.message)}}
async function apiLogin(){const email=document.getElementById('apiemail').value.trim(),password=document.getElementById('apipass').value;try{const r=await fetch(apiBase()+'/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw Error(j.detail||'Sign-in failed');localStorage.setItem('finsight_api_token',j.access_token);document.getElementById('apiauth').innerHTML='<span class="ok">Signed in to the FastAPI service.</span>';document.getElementById('tokenstate').textContent='Bearer token stored locally; clear it when finished.';toast('Server sign-in successful')}catch(e){toast(e.message)}}
async function runServerAgents(){const out=document.getElementById('agentresult');if(!out)return;let context;try{context=JSON.parse(document.getElementById('agentctx').value||'{}')}catch(e){return toast('Context must be valid JSON')}out.innerHTML='<small>Running orchestration…</small>';try{const result=await apiRequest('/api/v1/agents/orchestrate',{method:'POST',body:JSON.stringify({question:document.getElementById('agentq').value,financial_context:context})});out.innerHTML=`<div class="row"><span class="tag">Provider: ${esc(result.provider)}</span><span class="tag">Fallback: ${result.fallback_used?'Yes':'No'}</span><span class="tag">Request ${esc(result.request_id.slice(0,8))}</span></div>${result.findings.map(f=>`<div class="c" style="margin:8px 0"><b>${esc(f.agent)}</b> <span class="tag">${esc(f.severity)}</span><p>${esc(f.finding)}</p><p><small><b>Evidence:</b> ${esc((f.evidence||[]).join(' · '))}</small></p><p><small><b>Assumptions:</b> ${esc((f.assumptions||[]).join(' · '))}</small></p><p><small><b>Next step:</b> ${esc(f.next_step)}</small></p></div>`).join('')}`}catch(e){out.innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
async function apiRequest(path,options={}){const token=localStorage.getItem('finsight_api_token');if(!token)throw Error('Sign in to the backend first');const headers={'Content-Type':'application/json','Authorization':'Bearer '+token,...(options.headers||{})};const r=await fetch(apiBase()+path,{...options,headers});if(r.status===204)return null;let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.detail||('API request failed ('+r.status+')'));return j}
async function loadServerObligations(){try{const rows=await apiRequest('/api/v1/obligations');ensureAdv();let added=0;for(const o of rows){if(!P().obligations.some(x=>x.serverId===o.id)){P().obligations.push({id:Date.now()+added,serverId:o.id,name:o.name,amount:o.amount,due:o.due_date,type:o.kind,repeat:'once',status:o.status});added++}}save();render();toast('Loaded '+added+' server obligation(s)')}catch(e){toast(e.message)}}

function reply(q){q=q.toLowerCase();const s=stats();
if(/50.?30.?20/.test(q))return'Spend 50% of income on needs, 30% on wants and save 20%. Your savings rate is '+(s.rate*100).toFixed(0)+'%.';
if(/invest|sip|mutual/.test(q))return'Build a 6-month emergency fund first, then start a monthly SIP in a broad index fund. Open the Invest page for the calculator and allocations.';
if(/save|saving/.test(q))return'Pay yourself first, wait 48 hours on big purchases and review subscriptions. The Savings page lists more.';
if(/emergency/.test(q))return'Aim for 6 months of spending: '+inr(s.avgE*6)+' for you. Keep it in a savings account or liquid fund.';
if(/balance|spent|spend/.test(q))return`Balance ${inr(s.bal)}, income ${inr(s.inc)}, spent ${inr(s.exp)}.`;
if(/cibil|credit/.test(q))return'Pay credit card dues in full, keep utilisation under 30% and avoid many loan applications at once.';
if(/upi|pay/.test(q))return'Use the Pay page. It makes a UPI link and QR code that your own UPI app completes.';
if(/agent/.test(q))return'Open the Agents page. Five agents check budget, fraud, subscriptions, savings and investing.';
return'I can help with the 50/30/20 rule, saving, investing, emergency funds, credit score, UPI and your balance.'}
